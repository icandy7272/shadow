<section class="streak"><h2>练习日历</h2><div class="grid">{% for day in calendar_days %}<a href="/records/day/{{ day.date }}?range={{ range }}" class="d{{ day.level }}{{ ' ahead' if day.future }}" title="{{ day.date }}：{{ day.sentences }} 句 / {{ day.rounds }} 轮" aria-label="{{ day.date }}：{{ day.sentences }} 句 / {{ day.rounds }} 轮"></a>{% endfor %}</div><p class="hint">{% if range == 'all' %}日历显示最近十周的练习。{% else %}日历显示最近十周内所选范围的练习。{% endif %}每格一天，颜色越深表示练过的句子越多。已删除素材的练习也会保留。</p></section>
