<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shadow{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ assets() }}">
</head>
<body>
<header><a href="/" class="home">Shadow</a><a href="/#plan" class="nav">日课</a><a href="/sources" class="nav">素材库</a><a href="/vocab" class="nav">生词本</a>{% block subtitle %}{% endblock %}

<div id="service-banner" class="service-banner" hidden></div>
<main>{% block content %}{% endblock %}</main>
<script src="/static/ui.js?v={{ assets() }}"></script>
<script src="/static/service.js?v={{ assets() }}"></script>
<script src="/static/figures.js?v={{ assets() }}"></script>
<script src="/static/app.js?v={{ assets() }}"></script>

</body>
</html>
