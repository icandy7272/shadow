{% extends "base.html" %}{% block title %}账号与设备 · Shadow{% endblock %}{% block content %}<a class="page-back" href="/settings">‹ 设置</a><h1 class="page-title">账号与设备</h1><div id="account-panel"><p id="account-note" class="hint" role="status"></p><div id="auth-disabled" hidden><p>当前是本机使用模式，尚未启用登录保护。</p></div><div id="auth-account" hidden><p class="section-label">通行密钥</p><ul class="grouped-list" id="passkey-list"></ul><div class="grouped-list auth-form"><label class="auth-label">设备名称<input id="passkey-name" maxlength="40" placeholder="例如：我的 iPhone" autocomplete="off"></label><button type="button" id="add-passkey" class="primary">绑定面容／指纹登录</button></div><p class="section-label">添加设备</p><div class="grouped-list"><button type="button" class="grouped-row" id="create-device-code">生成设备码／二维码<span>›</span></button></div><p class="hint">添加密钥或设备前需要近期验证。若提示过期，请先<a href="/login?next=/account">重新登录</a>。</p><p class="section-label">登录状态</p><div class="grouped-list"><button type="button" class="grouped-row" id="logout-current">退出这台设备<span>›</span></button><button type="button" class="grouped-row danger" id="logout-all">退出所有设备</button></div></div></div><dialog class="settings-dialog" id="device-code-sheet" aria-labelledby="device-code-title"><div class="sheet-header"><h2 id="device-code-title">添加另一台设备</h2><button type="button" data-close-dialog>完成</button></div><div class="sheet-body device-code-body"><img id="device-qr" alt="在新设备上扫描此二维码登录"><b id="device-code"></b><p class="hint" id="device-code-note"></p><p class="hint">设备码相当于一次登录凭据，只给自己的设备使用。</p></div></dialog>{% endblock %}
