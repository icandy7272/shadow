{% extends "base.html" %}{% block title %}登录 · Shadow{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">你的跟读练习</p><h1>欢迎回来</h1><p class="hint">验证一次，这台设备可以保持登录。</p><form id="login-form" class="auth-form" data-next="{{ next | default('/today') }}"><button type="button" class="primary" data-passkey-login>使用面容／指纹登录</button><p class="hint">首次使用可先输入备用密码，再到设置绑定通行密钥。</p><label class="auth-label">备用密码<input name="password" type="password" inputmode="numeric" placeholder="6 位数字" autocomplete="current-password" aria-label="备用密码"></label><button type="submit">使用密码登录</button><label class="auth-remember"><input type="checkbox" name="remember" checked>记住这台设备 · 90 天</label><details><summary>从已登录设备加入</summary><label class="auth-label">一次性设备码<input name="device" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></label><button type="button" data-device-redeem>使用设备码登录</button><p class="hint">在已登录设备的「账号与设备」中生成，或扫描那里的二维码。</p></details><p class="hint" data-auth-note role="status"></p></form></section>{% endblock %}
