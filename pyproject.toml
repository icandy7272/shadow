[project]
name = "shadow"
version = "0.1.0"
description = "English shadowing trainer - CLI core"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.0",
    "praat-parselmouth>=0.4.5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "matplotlib>=3.8",
    "cmudict>=1.0",
]

[project.scripts]
shadow = "shadow.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
