const info={today:['把入口从“当前素材”转到“今天练什么”','Shadow 首页进入当前素材，日课、打卡和句子表格集中在同一页。','参考 openGym 的日期、周视图、今日训练主入口和分区卡片。','日期与今日任务置顶，主按钮直接继续练习；详细素材列表独立。底部四个入口始终可见。'],library:['素材库像训练计划一样，先选，再进入','导入表单常驻顶部；素材条目同时展示切换、重试和删除。','借鉴计划列表、搜索和卡片层级；素材库与训练计划是功能类比，并非同一种数据。','导入收进“＋”面板；卡片保留进度和最后练习位置，删除放进更多菜单。'],source:['句子列表从表格变成可点的任务列表','句子、时长、词数、轮数、问题数放在多列表格中。','借鉴一份计划内的动作列表和序号、状态层级。','整行进入练习，状态与时长置于副标题。未练句子只显示词数，保留盲听保护。'],listen:['像一项训练：专注当前步骤','三个步骤纵向排列，通过锁定、完成后折叠管理流程。','借鉴训练页顶部进度与当前动作的专注区；与真实训练流程结构对应。','顶部步骤胶囊，下方原声播放器与大触摸自评分。选分后进入默写，未解锁原文不出现。'],dictation:['键盘出现时，操作仍在手边','默写框、重听、对答案和跳过放在同一块内容中。','借鉴训练记录的直接输入与就地确认，避免离开当前任务。','大输入框、字数提示、明确提交；底部有重听与对答案。真实版本需验证软键盘和可视视口。'],shadow:['每一遍都是统一列表中的一行','每遍结果、汇总、节奏和音高图统一展示，可追加录音。','直接借鉴 openGym 的组次列表与 Add set：同一任务内继续加一组。','第 1、2、3、4…遍共用录音列表；点一行查看对应结果。追加一遍仍用现有流程，电脑保留 N。'],vocab:['像动作库一样，查找和回到原场景','生词带音标、释义、原形、出现次数和来源句。','借鉴动作库的搜索、分组列表与详情组织。','原句和释义按层级展开；“去练原句”明确可点；记住了在详情面板确认并可撤销。'],records:['进度集中，但不增加新的评分承诺','打卡在素材页，复述与自由说录音在对应页面。','借鉴 Stats 把热力图、历史与趋势放在同一入口。','整合现有练习数量、打卡与录音；曲线仅展示示例练习量，不新增“英语能力分”。'],talk:['给自主表达留一个专注空间','关键词复述、表达选择与历史录音已有独立页面。','借鉴专注训练的计时与结束操作；openGym 没有语言复述功能。','先看关键词，点开始后计时；结束后就地回听。保留原有“讲意思，不背原句”的要求。'],settings:['设置收进面板，训练页面保持安静','录几遍、听几次、自动停、麦克风集中在折叠设置中。','借鉴训练设置与首页设置菜单，次要操作离开主路径。','使用 iOS 式分组列表、步进器、开关和底部面板。控件含义保留，主题跟随系统可调整。']};
const status=()=>`<div class="statusbar"><span>9:41</span><span class="island"></span><span>▰ ▰ ▰</span></div>`;
const row=(ic,title,sub,action='',tail='')=>`<button class="row" ${action?`data-action="${action}"`:''}><span class="tile">${icon(ic)}</span><span class="body"><b>${title}</b><small>${sub}</small></span>${tail||`<span class="chev">${icon('chevron')}</span>`}</button>`;
const head=(title,action='sheet:settings',ic='gear',sub='')=>`<div class="app-head"><div>${sub?`<div class="sub">${sub}</div>`:''}<h1>${title}</h1></div><button class="circle-button" aria-label="${ic==='plus'?'添加':'设置'}" data-action="${action}">${icon(ic)}</button></div>`;
const nav=(gym=false)=>`<nav class="tabbar" aria-label="底部导航">${(gym?[['today','home','Home'],['library','calendar','Plan'],['listen','play','Start'],['records','chart','Stats'],['vocab','library','Exercises']]:[['today','home','今日'],['library','library','素材'],['vocab','book','生词'],['records','chart','记录']]).map(([p,i,t])=>`<button class="${state.page===p?'active ':''}${gym&&t==='Start'?'start-tab':''}" data-action="page:${p}">${icon(i)}${gym&&t==='Start'?'':`<span>${t}</span>`}</button>`).join('')}</nav>`;
const week=()=>`<div class="week">${['一','二','三','四','五','六','日'].map((d,i)=>`<button class="day ${state.day===12+i?'selected':''}" data-action="day:${12+i}">${d}<b>${12+i}</b></button>`).join('')}</div>`;
const wave=()=>`<div class="wave" aria-label="原声波形示意">${Array.from({length:37},(_,i)=>`<i style="height:${10+Math.abs(Math.sin(i*1.72))*48+Math.sin(i*.3)*9}px"></i>`).join('')}</div>`;
const heat=()=>`<div class="heatmap" aria-label="示例练习打卡热力图">${Array.from({length:84},(_,i)=>`<i class="${i%4!==0&&i%7!==1?'on':''}" style="opacity:${.3+(i%4)*.2}"></i>`).join('')}</div>`;
const steps=()=>`<div class="steps">${[['listen','1 盲听'],['dictation','2 默写'],['shadow','3 跟读']].map(([p,t])=>`<button class="${state.page===p?'active':''}" data-action="${p==='listen'||(p==='dictation'&&state.page!=='listen')||p==='shadow'&&['shadow','dictation'].includes(state.page)?'page:'+p:'toast:先完成当前步骤，再解锁下一步'}">${t}</button>`).join('')}</div>`;
const back=(title,action='page:source')=>`<div class="backhead"><button data-action="${action}" aria-label="返回">${icon('back')}返回</button><span class="title">${title}</span><button data-action="sheet:settings" aria-label="练习设置">${icon('more')}</button></div>`;
function today(){return head('今日','sheet:settings','gear','10 月 13 日 · 星期二')+`<div class="group padded">${week()}<div class="hero"><div class="tag">${state.day===13?'今天的日课':'10 月 '+state.day+' 日'} · 约 30 分钟</div><h2>让耳朵先于眼睛</h2><p>Stanford Commencement · 接着练第 12 句</p><button class="primary" data-action="page:listen">${icon('play')}继续练习</button></div></div><div class="section-title">今天的任务 <span style="float:right">1 / 4 完成</span></div><div class="group">${row('check','复习到期句子','已完成 · 3 句','page:source',`<span class="check">${icon('check')}</span>`)}${row('headphones','精练新句','盲听 → 默写 → 跟读 · 约 15 分钟','page:listen')}${row('play','串起来跟','把今天练过的几句连起来','toast:模拟连续播放今天练过的 5 句')}${row('mic','用自己的话复述','关键词提示 · 1 分 30 秒','page:talk')}</div><div class="group padded stats-mini"><div><b>12</b><small>连续天数</small></div><div><b>5</b><small>今天练过</small></div><div><b>28</b><small>本周句数</small></div></div>`}
function library(){return head('素材','sheet:import','plus')+`<label class="search">${icon('search')}<input placeholder="搜索素材" aria-label="搜索素材" id="source-search"></label><div class="segmented">${['全部','练习中','已完成'].map(t=>`<button class="${state.filter===t?'active':''}" data-action="filter:${t}">${t}</button>`).join('')}</div>`+(state.filter!=='已完成'?`<div class="group padded source-card"><div style="display:flex;gap:13px"><div class="cover">S</div><div><div class="pill">练习中</div><div class="source-title">Stanford Commencement</div><div class="sub">Steve Jobs · 演讲 · 15 分钟</div></div></div><div class="progress"><i style="width:31%"></i></div><div class="source-meta"><span>已练 25 / 80 句</span><span>今天</span></div><button class="primary" data-action="page:source">继续这份素材 ${icon('arrow')}</button></div><div class="group">${row('headphones','The power of curiosity','播客 · 22 分钟 · 已练 8 / 104 句','page:source')}${row('headphones','A conversation about design','访谈 · 18 分钟 · 尚未开始','page:source')}</div>`:`<div class="group">${row('check','A short story about change','已完成 · 32 句','page:source')}</div>`)+(state.imported?`<div class="group">${row('library','刚导入的示例素材','正在转写 · 模拟状态','toast:演示不执行真实下载或转写')}</div>`:'')}
function source(){return back('素材详情','page:library')+`<h2 style="font-size:24px;line-height:1.3">Stanford<br>Commencement</h2><div class="sub">15 分钟 · 80 句 · 已练 25 句</div><div class="progress"><i style="width:31%"></i></div><button class="primary" data-action="page:listen">${icon('play')}继续第 12 句</button><div class="section-title">句子</div><div class="segmented"><button class="active">全部</button><button data-action="toast:筛选为到期复习句子">该复习</button><button data-action="toast:筛选为尚未练习句子">未练过</button></div><div class="group">${row('check','11 · It all started long before I was born.','已练 2 轮 · 3.2 秒','page:shadow')}${row('headphones','12 · 8 个词','未练过 · 3.8 秒 · 先听，不看原文','page:listen')}${row('headphones','13 · 11 个词','未练过 · 4.6 秒','page:listen')}${row('headphones','14 · 6 个词','未练过 · 2.5 秒','page:listen')}${row('headphones','15 · 9 个词','未练过 · 4.1 秒','page:listen')}</div><div class="notice">未练句子隐藏原文。点进一句，先盲听。</div>`}
function listen(){return back('第 12 / 80 句')+steps()+`<h2 class="focus-title">先听，别看文字</h2><p class="focus-caption">不用每个词都懂，先判断你听清了多少。</p><div class="group padded">${wave()}<div class="timer">00:03.8</div><button class="play-big" data-action="play" aria-label="${state.playing?'停止':'播放'}原声">${icon(state.playing?'pause':'play')}</button><div class="sub" style="text-align:center">${state.playing?'正在模拟播放…':'原声 · 1.0× · 连播 3 遍'}</div></div><div class="section-title">这句听懂了多少？</div><div class="rating-grid">${[1,2,3,4,5].map(i=>`<button data-action="rate:${i}" aria-label="听懂程度 ${i} 分">${i}</button>`).join('')}</div><div class="rating-labels"><span>几乎没懂</span><span>每个词都清楚</span></div><div class="notice">选择分数后进入默写。此时不会显示原文。</div>`}
function dictation(){return back('第 12 / 80 句')+steps()+`<h2 class="focus-title">把听到的写下来</h2><p class="focus-caption">不会的词写一个 ?，对完答案再看释义。</p><textarea class="dictation" id="typed" placeholder="听到什么写什么…" aria-label="默写答案">${escapeText(state.typed)}</textarea><div style="display:flex;justify-content:space-between;margin:9px 3px"><span class="sub" id="word-count">已写 ${state.typed.trim()?state.typed.trim().split(/\s+/).length:0} / 8 个词</span><button class="secondary" data-action="unknown" style="padding:5px 10px;min-height:30px">不会 ?</button></div>${state.graded?`<div class="group padded"><div class="pill">答案已揭晓 · 示例反馈</div><p style="font-size:17px">It all started long before I was born.</p><div class="sub">${state.typed?'已提交你的答案；本预览不运行真实评分。':'跳过了默写。'}</div><p style="font-size:12px;color:var(--tint)">正式版沿用现有逐词判定和加入生词本功能。</p></div>`:`<div class="notice">原文仍然隐藏，提交或跳过后才揭晓。</div>`}`}
function shadow(){return back('第 12 / 80 句')+steps()+`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h2 style="font-size:22px;margin:0">${state.recording?'正在录音…':'这一轮的跟读'}</h2><button class="circle-button" data-action="sheet:record" aria-label="录音设置">${icon('gear')}</button></div>${state.recording?`<div class="group padded">${wave()}<p style="text-align:center;color:#ff453a">正在模拟第 ${state.takes+1} 遍 · 00:04</p><p class="sub" style="text-align:center">说完自动收，或点下方“说完了”</p></div>`:''}<div class="group"><div class="row"><div class="body"><b>${state.takes} 遍的中位 · 示例</b><small>可懂度 96% · 发声 1.08× · 停顿 0.94×</small></div></div>${Array.from({length:state.takes},(_,i)=>`<button class="take ${state.chosen===i?'active':''}" data-action="take:${i}"><span class="number">${i+1}</span><span class="body"><b>第 ${i+1} 遍 ${i===2?'· 代表这轮':''}</b><small>可懂度 ${[92,96,100,100][Math.min(i,3)]}% · 发声 ${[1.15,1.08,1.04,1.03][Math.min(i,3)]}×</small></span>${icon('play')}</button>`).join('')}</div><div class="group padded"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">第 ${state.chosen+1} 遍 · 音高</b><button style="background:none;color:var(--tint);font-size:11px" data-action="play">试听</button></div><div class="chart-label"><span>┄ 原声</span><span style="color:var(--tint)">━ 我的</span></div><div class="chart"><svg viewBox="0 0 290 100" role="img" aria-label="示例音高曲线，原声与我的录音"><path d="M0 25H290 M0 50H290 M0 75H290" stroke="var(--line)" fill="none"/><path d="M3 42 Q30 17 55 40 T108 29 T165 45 T218 58 T287 85" stroke="var(--sub)" stroke-dasharray="5 4" stroke-width="2" fill="none"/><path d="M3 48 Q30 23 55 43 T108 38 T165 44 T218 49 T287 67" stroke="var(--tint)" stroke-width="2.5" fill="none"/></svg></div><div class="word-chips">${['It','all','started','long','before','I','was','born'].map((w,i)=>`<button class="${state.word===i?'selected':''}" data-action="word:${i}">${w}</button>`).join('')}</div><p class="sub" style="margin-bottom:0">${state.word===null?'点词试听；正式版支持触摸选择连续词。':'已选词：模拟原声 → 我的录音试听。'}</p></div><div class="group padded"><b style="font-size:13px">下一遍留意</b><p style="font-size:13px;margin-bottom:0">“born” 收尾再沉一点。<br><span class="sub">2 / ${state.takes} 遍出现 · 示例提示</span></p></div>`}
function vocab(){return head('生词','sheet:settings','gear')+`<label class="search">${icon('search')}<input id="vocab-search" placeholder="搜索单词或释义" aria-label="搜索生词"></label><div class="sub" style="margin-bottom:12px">24 个词 · 按最近加入排序</div>`+[['commencement','/kəˈmensmənt/','n. 毕业典礼；开始','Stanford commencement speech'],['curiosity','/ˌkjʊriˈɑːsəti/','n. 好奇心','Follow your curiosity.'],['eventually','/ɪˈventʃuəli/','adv. 最后；终于','Eventually, it all made sense.']].map(([w,p,m,q])=>`<div class="group padded vocab-card"><div style="display:flex;justify-content:space-between"><div><div class="vocab-word">${w}</div><span class="sub">${p}</span></div><button class="circle-button" data-action="sheet:word" aria-label="${w}更多操作">${icon('more')}</button></div><div class="meaning">${m}</div><button class="quote" style="border:0;width:100%;text-align:left" data-action="page:listen">${q}<br><b>回到原句 ${icon('arrow')}</b></button></div>`).join('')}
function records(){return head('记录')+`<div class="segmented"><button class="active">本周</button><button data-action="toast:切换为本月练习记录">本月</button><button data-action="toast:切换为全部练习记录">全部</button></div><div class="group padded"><div class="stats-mini"><div><b>28</b><small>练过的句子</small></div><div><b>84</b><small>跟读录音</small></div><div><b>12</b><small>连续天数</small></div></div>${heat()}<div class="sub" style="margin-top:10px">过去 12 周 · 方格深浅表示练习量</div></div><div class="section-title">练习历史</div><div class="group">${row('headphones','今天 · Stanford Commencement','5 句 · 15 遍跟读','page:source')}${row('headphones','昨天 · The power of curiosity','4 句 · 12 遍跟读','page:source')}</div><div class="section-title">自主表达录音</div><div class="group">${row('mic','今天的复述','1:28 · 根据 5 句关键词复述','play')}${row('mic','周六的自由说','2:04 · 选了 3 个表达','page:talk')}</div><div class="notice">这里整合已有记录，不增加新的能力评分。</div>`}
function talk(){return back('自主表达','page:today')+`<h2 class="focus-title">用自己的话讲一遍</h2><p class="focus-caption">讲意思，不背原句。忘了就换简单的说法。</p><div class="group padded"><div class="sub">今天新练的 5 句 · 关键词</div><div class="word-chips">${['adoption','college','curiosity','choices','trust'].map(t=>`<button data-action="toast:这是复述提示词，不展开原文">${t}</button>`).join('')}</div></div><div class="group padded">${wave()}<div class="timer">${state.recording?'00:18':'01:30'}</div><p class="sub" style="text-align:center">${state.recording?'模拟录音中':'准备好后开始说'}</p></div><div class="section-title">上次录的</div><div class="group">${row('mic','昨天的复述','1:26 · 回听一遍就够了','play')}</div>`}
function settings(){return head('设置','page:today','back')+`<div class="section-title">练习</div><div class="group">${row('headphones','跟读录音设置','每轮 3 遍 · 每遍前听 '+state.pre+' 次','sheet:record')}${row('play','播放速度','当前 1.0×','sheet:speed')}</div><div class="section-title">外观</div><div class="group">${row('gear','深色模式',state.dark?'已开启':'未开启','theme',`<span class="switch ${state.dark?'':'off'}"></span>`)}</div><div class="section-title">服务</div><div class="group">${row('check','服务在线','HTTPS · 手机可使用麦克风','toast:仅为状态示例，预览不会连接真实服务')}${row('book','关于 Shadow','个人英语影子跟读训练','toast:Shadow · 设计预览 01')}</div><div class="notice">桌面快捷键：R 开始一轮 · N 再录一遍 · 空格播放 / 停止 · 回车提交。</div>`}
function actionbar(){if(state.page==='dictation')return `<div class="actionbar"><div class="action-pair"><button class="secondary" data-action="play">${icon('headphones')}重听</button><button class="primary" data-action="${state.graded?'page:shadow':'grade'}">${state.graded?'开始跟读':'对答案'}</button></div>${!state.graded?`<button style="background:none;color:var(--sub);font-size:11px;display:block;margin:9px auto 0" data-action="skip">跳过默写</button>`:''}</div>`;if(state.page==='shadow')return `<div class="actionbar"><div class="action-pair"><button class="secondary" data-action="${state.recording?'redo':'page:listen'}">${state.recording?'这遍重来':'下一句'}</button><button class="primary" data-action="${state.recording?'finish':'record'}">${icon(state.recording?'stop':'mic')}${state.recording?'说完了':'再录 1 遍'}${!state.recording?`<small style="opacity:.8;font-size:10px">第 ${state.takes+1} 遍</small>`:''}</button></div></div>`;if(state.page==='talk')return `<div class="actionbar"><button class="primary" data-action="${state.recording?'finish-talk':'record-talk'}">${icon(state.recording?'stop':'mic')}${state.recording?'说完了':'开始复述'}</button></div>`;return nav()}
function sheet(){if(!state.sheet)return '';let content='';let title='练习设置';if(state.sheet==='record'||state.sheet==='settings'){content=`<div class="group"><div class="row"><div class="body"><b>每遍前听</b><small>追加录音也沿用此设置</small></div><div class="stepper"><button data-action="pre:-1" aria-label="减少示范次数">−</button><span>${state.pre}</span><button data-action="pre:1" aria-label="增加示范次数">＋</button></div></div><button class="row" data-action="auto"><div class="body"><b>说完自动停</b><small>读不到音量时仍可手动停止</small></div><span class="switch ${state.auto?'':'off'}"></span></button>${row('mic','麦克风','默认麦克风','toast:正式版在这里选择可用麦克风')}</div><div class="group">${row('gear','全部设置','外观与服务状态','open-settings')}</div>`}else if(state.sheet==='import'){title='导入素材';content=`<div class="group padded"><label class="sub" for="import-url">视频或播客链接</label><input id="import-url" placeholder="https://…" type="url" style="width:100%;padding:12px;border:0;border-radius:9px;background:var(--soft);color:var(--ink);margin:10px 0"><p class="sub">支持 60 分钟以内的素材，导入时仍可练习。</p><button class="primary" data-action="import">导入示例素材</button></div>`}else if(state.sheet==='word'){title='生词操作';content=`<div class="group">${row('check','记住了','从生词本移出，可撤销','remember')}${row('headphones','练原句','重新听一遍词所在的句子','open-listen')}</div>`}else{title='播放速度';content=`<div class="group">${['0.5×','0.75×','1.0×'].map(t=>row('play',t,'只影响试听，跟读示范保持原速','speed:'+t)).join('')}</div>`}return `<div class="modal-backdrop" data-action="close-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="grabber"></div><div class="sheet-head"><b>${title}</b><button data-action="close">完成</button></div>${content}</section></div>`}
function current(){let p=state.page;let body='';if(p==='today'||p==='source'){body=`<h3>Stanford Commencement</h3><div class="sub">练过 25 / 80 句 · 素材 15 分钟</div><div class="group padded"><b>今天的日课 · 周二</b><p>☑ 复习到期的<br>☐ 精练新句子<br>☐ 串起来<br>☐ 复述<br>☐ 泛听</p><div class="old-buttons"><span>开始下一句 →</span><span>完整日课</span></div></div><div class="group padded"><b>今天 5 句 · 连续 12 天</b>${heat()}</div><p class="sub">未练句子隐藏原文 · □ 全部显示</p><div class="old-buttons"><span>全部</span><span>该复习</span><span>没练过</span><span>问题没解决</span></div><table class="old-table"><tr><th>#</th><th>句子</th><th>时长</th><th>词</th><th>练过</th></tr>${[11,12,13,14,15,16].map(i=>`<tr><td>${i}</td><td>${i===11?'It all started long before I was born.':'8 个词'}</td><td>3.8s</td><td>8</td><td>${i===11?2:0}</td></tr>`).join('')}</table>`}else if(['listen','dictation','shadow'].includes(p)){body=`<div class="sub">Stanford · 第 12 句 / 共 80 句</div>${['盲听','默写','跟读'].map((t,i)=>`<div class="group padded"><b>${i+1} ${t}</b><p class="sub">${['不看文字，就听。听完给自己打个分。','听到什么写什么，一整句写在下面。','每遍前自动放几次原声，嘀一声开口。'][i]}</p>${i===0?'<div class="old-buttons"><span>▶ 播放</span><span>连播 10 遍</span></div><div class="old-buttons"><span>1 几乎没懂</span><span>2 抓到几个词</span><span>3 大意懂了</span><span>4 基本懂了</span><span>5 全清楚</span></div>':i===1?'<div style="height:65px;border:1px solid #ddd"></div><div class="old-buttons"><span>对答案 ↵</span><span>跳过默写</span></div>':'<div class="old-buttons"><span>开始 R</span><span>录 3 遍 · 每遍前听 4 次</span><span>看一眼原文 T</span></div><p>3 遍的中位 · 可懂度 96%</p><div class="old-buttons"><span>第 1 遍</span><span>第 2 遍</span><span>第 3 遍</span></div><p>图 1 · 节奏<br><br>图 2 · 音高</p><div class="old-buttons"><span>再录 1 遍 N</span></div>'}</div>`).join('')}`}else if(p==='library'){body='<h3>素材库</h3><div class="old-buttons"><span>https://…</span><span>导入</span></div><p class="sub">下载、转写、切句要几分钟</p>'+['Stanford Commencement','The power of curiosity','A conversation about design'].map(t=>`<div class="group padded"><b>${t}</b><p class="sub">15 分钟 · 练过 25 / 80 句</p><div class="old-buttons"><span>切到这份</span><span>删除</span></div></div>`).join('')}else if(p==='vocab'){body='<h3>生词本 · 24 个词</h3><p>排序 最近 / 次数</p>'+['commencement','curiosity','eventually'].map(t=>`<div class="group padded"><b>${t}</b><p>/音标/ · 记过 2 次</p><p>释义 · 原形 · 原句</p><div class="old-buttons"><span>记住了</span><span>去练这句 →</span></div></div>`).join('')}else if(p==='records'){body='<h3>现有记录分布</h3><div class="group padded"><b>素材页</b><p>打卡格子 · 连续天数 · 本周句数</p>'+heat()+'</div><div class="group padded"><b>复述 / 自由说页面</b><p>录过的 · 日期 · 时长 · 音频回听</p></div><p class="sub">当前没有统一“记录”入口。</p>'}else if(p==='talk'){body='<h3>复述</h3><p>今天新练的 5 句 · 关键词按原文顺序</p><div class="group padded">adoption · college · curiosity<p>讲意思，不用一字不差。</p><div class="old-buttons"><span>▶ 开始说（1 分半）</span></div></div><h3>录过的</h3><div class="group padded">昨天 · 1:26<p>▶ ━━━━━━━</p></div>'}else{body='<h3>录音设置</h3><div class="group padded"><b>录 3 遍 · 每遍前听 4 次</b><p>录几遍　[ 3 ]<br>每遍前听 [ 4 ]<br>☑ 说完自动停<br>麦克风 [ 默认 ]</p><div class="old-buttons"><span>试音</span></div></div><p class="sub">设置嵌在跟读步骤的折叠区域，服务状态显示在页顶。</p>'}return status()+`<div class="old-nav"><b>Shadow</b><span>日课</span><span>素材库</span><span>生词本</span></div><div class="screen">${body}</div><div class="home-indicator"></div>`}
function gym(){let p=state.page;let body='';if(p==='today'){body=head('openGym','noop','gear','Tuesday 13 October')+`<div class="group padded">${week()}<div class="hero"><div class="tag">TODAY</div><h2>Pull Day</h2><p>Rescheduled · 5 exercises</p><button class="primary" data-action="noop">${icon('play')}Start</button></div><p class="sub" style="text-align:center">Choose a different workout</p></div><div class="group">${row('calendar','At the gym','Check in','noop')}</div><div class="group padded"><div class="sub">Body weight</div><h2 style="font-size:30px;margin:9px 0">78.7 <small style="font-size:13px">kg</small></h2><div class="progress"><i style="width:66%"></i></div><div class="sub">Goal 77 kg · 13 week streak</div></div>`}else if(['listen','dictation','shadow','talk'].includes(p)){body=back('Pull Day','noop')+`<div class="sub" style="text-align:center;margin-bottom:15px">04:32 · 3 / 17 sets</div><div class="word-chips">${[1,2,3,4,5].map(i=>`<button style="${i===1?'background:var(--tint);color:#12200d':''}">${i}</button>`).join('')}</div><div class="group padded" style="margin-top:15px;text-align:center;height:175px;display:grid;place-items:center"><div>${icon('play')}<p class="sub">Exercise demonstration</p><b>当前动作的示范区域</b></div></div><h3 style="font-size:19px">Cable Lat Pulldown</h3><div class="sub">Lats · Cable · Plan: 4 × 10</div><p class="sub">Last time: 65×10, 65×10, 65×10</p><div class="group"><div class="row sub" style="font-size:10px;justify-content:space-around">SET　 WEIGHT　 REPS　 DONE</div>${[1,2,3,4].map(i=>`<div class="row" style="min-height:55px;justify-content:space-around"><span>${i}</span><span style="background:#303030;padding:6px 12px;border-radius:6px">− 70 ＋</span><span>10</span><span style="color:var(--tint)">${i<4?'✓':'○'}</span></div>`).join('')}<div class="row" style="color:var(--tint)">＋ Add set</div></div><div class="old-buttons"><span>Prev</span><span>Next</span></div>`}else if(p==='records'){body=head('Stats','noop')+`<div class="group padded"><div class="sub">Training history</div><h2>33 workouts</h2>${heat()}<p class="sub">Year-long activity heatmap</p></div><div class="group padded"><div class="sub">Progress</div><h3>Estimated 1RM</h3><div class="progress"><i style="width:70%"></i></div><p class="sub">历史、趋势与训练量集中展示</p></div>`}else if(p==='settings'){body=head('Settings','noop')+`<div class="section-title">Appearance</div><div class="group">${row('gear','Theme','Dark · accent colour','noop')}${row('calendar','Week starts on','Monday','noop')}</div><div class="section-title">Workout</div><div class="group">${row('play','Workout display','Card or list view','noop')}${row('gear','Exercise options','次要操作收进菜单','noop')}</div>`}else{body=head(p==='vocab'?'Exercises':p==='source'?'Pull Day':'Plan','noop','plus')+`<div class="search">${icon('search')}${p==='vocab'?'Search exercises':'Search routines'}</div><div class="segmented"><button class="active">All</button><button>Equipment</button><button>Muscle</button></div><div class="group">${row('library',p==='vocab'?'Cable Lat Pulldown':'Pull Day','5 exercises · training routine','noop')}${row('library',p==='vocab'?'Barbell Bent Over Row':'Push Day','6 exercises · training routine','noop')}${row('library',p==='vocab'?'Dumbbell Hammer Curl':'Leg Day','4 exercises · training routine','noop')}</div><div class="notice">用于说明参考项目的信息层级与功能类比；具体控件以真实演示为准。</div>`}return status()+`<div class="screen">${body}</div>${!['listen','dictation','shadow','talk'].includes(p)?nav(true):''}<div class="home-indicator"></div>`}
const escapeText=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.body.classList.toggle('only-design',state.only);document.getElementById('pages').innerHTML=pages.map(([p,t])=>`<button class="${state.page===p?'active':''}" data-page="${p}">${t}</button>`).join('');document.getElementById('current').innerHTML=current();document.getElementById('gym').innerHTML=gym();const d=document.getElementById('design');d.classList.toggle('dark-design',state.dark);d.innerHTML=status()+`<div class="screen">${({today,library,source,listen,dictation,shadow,vocab,records,talk,settings})[state.page]()}</div>${actionbar()}<div class="home-indicator"></div>${sheet()}${state.toast?`<div class="toast" role="status">${state.toast}</div>`:''}`;const [title,a,b,c]=info[state.page];document.getElementById('mapping').innerHTML=`<h3>${title}</h3><div class="mapping-grid"><div><b>当前 Shadow</b><p>${a}</p></div><div><b>借鉴 openGym</b><p>${b}</p></div><div><b>Shadow 的 iOS 式调整</b><p>${c}</p></div></div>`;document.getElementById('mode').textContent=state.only?'恢复三栏对照':'仅看 Shadow 设计';document.getElementById('theme').textContent=state.dark?'切换浅色设计':'切换深色设计';const typed=document.getElementById('typed');if(typed)typed.addEventListener('input',()=>{state.typed=typed.value;document.getElementById('word-count').textContent=`已写 ${typed.value.trim()?typed.value.trim().split(/\s+/).length:0} / 8 个词`});['source-search','vocab-search'].forEach(id=>{const input=document.getElementById(id);if(input)input.addEventListener('input',()=>{document.querySelectorAll('#design .source-card, #design .vocab-card').forEach(card=>card.hidden=!card.textContent.toLowerCase().includes(input.value.toLowerCase()))})})}
function toast(text){state.toast=text;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{state.toast='';render()},2200)}
function finish(){clearTimeout(recordTimer);state.recording=false;state.takes++;state.chosen=state.takes-1;render();toast(`第 ${state.takes} 遍已追加到这一轮（模拟）`)}
function act(value){const [action,...parts]=value.split(':');const arg=parts.join(':');if(action==='page'){clearTimeout(recordTimer);clearTimeout(playTimer);state.recording=false;state.playing=false;state.sheet=null;state.toast='';state.page=arg;render()}else if(action==='sheet'){state.sheet=arg;render()}else if(action==='close'){state.sheet=null;render()}else if(action==='open-settings'){state.sheet=null;state.page='settings';render()}else if(action==='open-listen'){state.sheet=null;state.page='listen';render()}else if(action==='play'){state.playing=!state.playing;render();if(state.playing){toast('模拟播放 · 不会播放真实音频');playTimer=setTimeout(()=>{state.playing=false;render()},3500)}}else if(action==='rate'){state.page='dictation';render();toast(`已记下 ${arg} 分，进入默写`)}else if(action==='unknown'){state.typed+=(state.typed?' ':'')+'?';render();document.getElementById('typed')?.focus()}else if(action==='grade'||action==='skip'){state.graded=true;render()}else if(action==='record'){state.recording=true;state.playing=false;render();if(state.auto)recordTimer=setTimeout(finish,4500)}else if(action==='finish'){finish()}else if(action==='redo'){clearTimeout(recordTimer);state.recording=false;render();toast('这一遍作废，已有录音保留')}else if(action==='take'){state.chosen=Number(arg);state.word=null;render()}else if(action==='word'){state.word=Number(arg);render();toast('模拟选词试听：原声 → 我的录音')}else if(action==='filter'){state.filter=arg;render()}else if(action==='day'){state.day=Number(arg);render()}else if(action==='pre'){state.pre=Math.max(0,Math.min(20,state.pre+Number(arg)));render()}else if(action==='auto'){state.auto=!state.auto;render()}else if(action==='theme'){state.dark=!state.dark;render()}else if(action==='import'){state.imported=true;state.sheet=null;state.page='library';render();toast('示例素材已加入，不执行真实导入')}else if(action==='remember'){state.sheet=null;render();toast('模拟移出生词本 · 正式版提供撤销')}else if(action==='speed'){state.sheet=null;render();toast(`试听速度 ${arg}（模拟）`)}else if(action==='record-talk'){state.recording=true;render()}else if(action==='finish-talk'){state.recording=false;render();toast('模拟复述已保存，可在记录页回听')}else if(action==='toast'){toast(arg)}}
document.getElementById('pages').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)act('page:'+b.dataset.page)});document.getElementById('design').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='close-backdrop'){if(e.target===b){state.sheet=null;render()}return}act(b.dataset.action)});document.getElementById('mode').onclick=()=>{state.only=!state.only;render()};document.getElementById('theme').onclick=()=>act('theme');document.getElementById('reset').onclick=()=>{clearTimeout(recordTimer);clearTimeout(playTimer);clearTimeout(toastTimer);Object.assign(state,{page:'today',takes:3,chosen:2,recording:false,playing:false,typed:'',graded:false,sheet:null,pre:4,auto:true,filter:'全部',day:13,word:null,toast:'',imported:false});render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render()}if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;if(e.code==='KeyN'&&state.page==='shadow'&&!state.recording&&!state.sheet){e.preventDefault();act('record')}});render();
</script></body></html>
